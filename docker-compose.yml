services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dsc
      POSTGRES_PASSWORD: dsc_password
      POSTGRES_DB: display_stock
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./backups:/backups"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dsc -d display_stock"], interval: 5s, retries: 10 }
  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dsc:dsc_password@db:5432/display_stock?schema=public
    ports: ["3000:3000"]
volumes: { pgdata: {} }
