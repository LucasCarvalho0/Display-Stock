<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.30" />
    </filter>
  </defs>

  <!-- Fundo Minimalista Slate 900 -->
  <rect width="512" height="512" rx="100" fill="#0F172A" />

  <!-- Card Branco Centralizado da Logo (Squircle com cantos suaves) -->
  <g filter="url(#cardShadow)">
    <rect x="46" y="82" width="420" height="266" rx="42" fill="#FFFFFF" />
    <!-- Marca Sesé em Tipografia Oficial em Itálico Negrito -->
    <text x="256" y="240" font-family="Arial, Helvetica, sans-serif" font-size="124" font-weight="900" font-style="italic" fill="#000000" text-anchor="middle" letter-spacing="-3">sesé</text>
  </g>

  <!-- Nome do Aplicativo Minimalista -->
  <text x="256" y="415" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">DISPLAY STOCK</text>

  <!-- Linha de Destaque Sesé Ciano -->
  <line x1="166" y1="452" x2="346" y2="452" stroke="#00B0F0" stroke-width="6" stroke-linecap="round" />
</svg>
